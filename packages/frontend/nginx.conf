# nginx config for docker container

server {
  listen 80;
  server_name localhost;

  # Second line of defense behind the backend sanitizer: post and comment bodies
  # are rendered with v-html, so a sanitizer bypass must still not be able to run
  # a script, load a plugin or reframe the app.
  # Images, media and frames stay wide open because posts embed third party
  # content, and connect-src has to cover an API URL that is only known when the
  # container starts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; font-src 'self' data:; frame-src https:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
}
